<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Centralización Farmacéutica</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <!-- Video de fondo de YouTube -->
    <div class="video-background">
        <div id="youtube-video" class="youtube-container"></div>
        <div class="video-overlay"></div>
    </div>

    <nav>
        <div class="navbar-container">
            <div class="nav-left">
                <div class="brand-logo">
                    <i class="fas fa-pills"></i>
                    <span>CentralFarma</span>
                </div>
                <div class="menu-toggle" id="mobile-menu">
                    <span class="bar"></span>
                    <span class="bar"></span>
                    <span class="bar"></span>
                </div>
            </div>
            <div class="nav-right" id="nav-right">
                <div class="nav-links">
                    <a href="index.html">Inicio</a>
                    <a href="medicamentos.html">Medicamentos</a>
                </div>
                <div class="auth-links">
                    <a href="login.html" style="font-weight: bold; text-decoration: underline;">Login</a>
                    <a href="register.html">Registrarse</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h1>Iniciar Sesión</h1>
                <p>Accede a tu cuenta para gestionar tu información</p>
            </div>
            
            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <div class="input-with-icon">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" name="email" required placeholder="tu@email.com">
                    </div>
                    <span class="error-message" id="emailError"></span>
                </div>
                
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <div class="input-with-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" name="password" required placeholder="Ingresa tu contraseña">
                        <button type="button" id="togglePassword" class="password-toggle">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <span class="error-message" id="passwordError"></span>
                </div>
                
                <div class="form-options">
                    <div class="remember-me">
                        <input type="checkbox" id="remember" name="remember">
                        <label for="remember">Recordarme</label>
                    </div>
                    <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
                </div>
                
                <button type="submit" class="submit-btn">Iniciar Sesión</button>
                
                <div class="social-login">
                    <p>O inicia sesión con</p>
                    <div class="social-buttons">
                        <button type="button" class="social-btn google-btn">
                            <i class="fab fa-google"></i>
                            Google
                        </button>
                        <button type="button" class="social-btn facebook-btn">
                            <i class="fab fa-facebook-f"></i>
                            Facebook
                        </button>
                    </div>
                </div>
            </form>
            
            <div class="login-footer">
                <p>¿No tienes una cuenta? <a href="register.html">Regístrate aquí</a></p>
            </div>
        </div>
    </main>

    <!-- API de YouTube -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="js/login.js"></script>
</body>
</html>
